<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do-List</title>
</head>

<body>
    <section id="sidebar">

        <div class="heading">
            <h1>To Do List</h1>
            <button class="open-dialog-Btn">+ Add Task</button>
            <hr>
        </div>

        <div class="project-section">
            <div class="project-section-heading">
                <h3>My Projects</h3>
                <button class="open-project-dialog">+</button>
            </div>
            <div class="projects">
                <ul>
                    <li class="select">
                        <div>
                            <span id="project-name">To-Do</span>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

    </section>

    <main>
        <div id="main-canvas">
            <div id="canvas-heading"></div>

            <div id="to-dos">
                <div class="to-do-minimised">
                    <div class="task">
                        <input type="checkbox" name="todo" id="todo">
                        <label for="todo">Run 10km</label>
                    </div>
                    <div class="date">Today</div>
                    <hr>
                </div>

                <div class="to-do-minimised">
                    <div class="task">
                        <input type="checkbox" name="todo" id="todo">
                        <label for="todo">Run 10km</label>
                    </div>
                    <div class="date">12-02-2027</div>
                    <hr>
                </div>
            </div>

        </div>
    </main>

    <dialog class="add-task-dialog" closedby="any">

        <form class="task-form" action="#">
            <div class="title text">
                <label for="title">Title:</label>
                <input type="text" name="title" id="title" required>
            </div>

            <div class="description text">
                <label for="description">Description:</label>
                <input type="text" name="description" id="description">
            </div>

            <div class=".date-priority">
                <label for="date">Date:</label>
                <input type="date" name="date" id="date">

                <label for="priority">Priority</label>
                <select name="priority" id="priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

            </div>

            <button id="add-task">submit</button>
        </form>

    </dialog>

    <dialog class="add-project-dialog" closedby="any">
        <form action="#" class="project-form">

            <div class="project-name">
                <label for="project">Project Name: </label>
                <input type="text" name="project" id="project" maxlength="20" required>
            </div>

            <div class="color-container">
                <label for="color" class="color-picker">Choose Color: </label>
                <input type="color" value="#f55656" name="color" id="color">
            </div>

            <button class="add-project-Btn">Add</button>

        </form>
    </dialog>

    <dialog class="delete-popUp" closedby="any">
        <h3></h3>
        <div>
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
    </dialog>

</body>

</html>
